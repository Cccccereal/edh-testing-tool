name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt 检查（本地 .gitattributes 统一 LF；格式化漂移直接红）
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt：$unformatted"
            exit 1
          fi

      # 含前端镜像一致性检查（cmd/mobile/web 必须严格跟随 cmd/server/web）
      # 与接口契约路由同步检查（internal/api 路由表 ↔ docs/api/openapi.yaml paths）
      - name: Go tests (unit + fuzz seeds + web mirror + route contract)
        run: go test ./...

      # 静态分析闸门（本地构建脚本一直在跑，进 CI 补全）
      - name: go vet
        run: go vet ./...

      # 契约类型再生成防漂移：api-types.d.ts 必须与 docs/api/openapi.yaml 一致
      # （改接口只改生成文件不改 spec 的话，这里会红）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate API types and check for drift
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code cmd/server/web/api-types.d.ts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps (pytest + Playwright)
        run: |
          pip install pytest requests pyyaml jsonschema playwright
          python -m playwright install --with-deps chromium

      # 离线黑盒测试：契约测试 + route 拦截型 UI 冒烟 + 全栈 E2E 旅程
      # （tests/e2e：六源指向本地 stub 的真实 Go 服务 + Chromium，不触第三方）
      - name: API black-box + UI + E2E tests (offline)
        run: pytest -q
