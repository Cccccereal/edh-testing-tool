name: Release

on:
  # 推送到 main 分支自动触发，版本号 = 提交时间
  push:
    branches: [main]
  # 手动触发（版本号同样取最后一次提交的时间）
  workflow_dispatch:

# 防止多次 push 的构建同时进行，互相抢 Release
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # 用于创建 GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 自动按 go.mod 里的版本装 Go
          cache: true               # 缓存依赖，加速后续构建

      # 版本号 = HEAD 提交的时间（保留提交者时区），格式 20260818-1842
      - name: Resolve version from commit time
        shell: pwsh
        run: |
          $v = git log -1 --date=format:'%Y%m%d-%H%M' --format=%cd
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v)) { throw "Failed to read commit time" }
          Write-Host "Version (commit time): $v"
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Run tests
        shell: pwsh
        run: go test ./...

      # 1) 先编译 Go 服务端（客户端要把它嵌进去，顺序不能换）
      - name: Build server.exe
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o server.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # runner 自带 Node.js，npm 装预编译的 CLI，比 cargo install 快得多
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      # 2) 把 server.exe 放到 include_bytes! 约定的位置，再编译客户端
      #    （客户端 exe 内嵌服务端，单文件分发）
      - name: Build Tauri client (embeds server.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri\binaries -Force | Out-Null
          Copy-Item server.exe src-tauri\binaries\server-x86_64-pc-windows-msvc.exe
          Push-Location src-tauri
          try {
            tauri build
            if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
          } finally { Pop-Location }

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item src-tauri\target\release\edh-powerlevel-client.exe .
          foreach ($f in @("server.exe", "edh-powerlevel-client.exe")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$f.sha256" -Value "$hash  $f" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edh-powerlevel-${{ env.VERSION }}
          path: |
            server.exe
            server.exe.sha256
            edh-powerlevel-client.exe
            edh-powerlevel-client.exe.sha256
          if-no-files-found: error

      # 创建 Release，tag 名形如 v20260818-1842
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: edh-powerlevel ${{ env.VERSION }}
          files: |
            server.exe
            server.exe.sha256
            edh-powerlevel-client.exe
            edh-powerlevel-client.exe.sha256
            server-android-arm64
            server-android-arm64.sha256
            server-linux-arm64
            server-linux-arm64.sha256
          generate_release_notes: true

  # 移动端交叉编译：纯 Go、零 cgo，直接编译出手机可运行的二进制。
  #   - android/arm64：绝大多数安卓手机（经 Termux 运行）
  #   - linux/arm64：  Termux 手机、树莓派、ARM 服务器
  #   （android/amd64 与 android/386 需要 NDK+cgo，Go 纯 Go 路径不支持，故不产出）
  mobile:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version from commit time
        shell: bash
        run: |
          v="$(git log -1 --date=format:'%Y%m%d-%H%M' --format=%cd)"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Cross-compile mobile binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-mobile

          build() {
            local goos="$1" goarch="$2" out="$3"
            echo ">> $goos/$goarch -> $out"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -buildvcs=false -trimpath -ldflags "-s -w" \
              -o "dist-mobile/$out" ./cmd/server
          }

          build android arm64 server-android-arm64
          build linux   arm64 server-linux-arm64

          cd dist-mobile
          for f in server-android-arm64 server-linux-arm64; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload mobile binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist-mobile/server-android-arm64
            dist-mobile/server-android-arm64.sha256
            dist-mobile/server-linux-arm64
            dist-mobile/server-linux-arm64.sha256

  # 真正的 Android APK：用 gomobile 把 cmd/mobile 打成 AAR（内嵌 HTTP 服务），
  # 再用 android/ 壳工程的 WebView 加载本地服务,打包成可安装的 APK。
  # 需要 Android SDK(compileSdk 34)+ NDK + JDK 17，均由 github runner 与 actions 安装。
  mobile-apk:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653

      # 壳工程已提交 gradlew + gradle-wrapper.jar + wrapper.properties，
      # 所以这里直接用 wrapper 构建，无需现场生成、也无需系统 gradle。
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build mobile AAR (gomobile bind)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/mobile.aar ./cmd/mobile

      - name: Assemble APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Resolve version and stage APK
        run: |
          v="$(git log -1 --date=format:'%Y%m%d-%H%M' --format=%cd)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" "edh-powerlevel-$v.apk"
          echo "APK_PATH=edh-powerlevel-$v.apk" >> "$GITHUB_ENV"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.APK_PATH }}
