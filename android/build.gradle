// Top-level Android Gradle build file for the edh-powerlevel mobile shell.
//
// This project is intentionally minimal: it wraps a single Activity whose WebView
// loads the in-process Go HTTP server (built via gomobile into mobile.aar). The AAR
// is expected at app/libs/mobile.aar before Gradle runs — the release workflow copies
// it there after `gomobile bind`.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}
