plugins {
    id 'com.android.application'
}

// Release signing reads from env vars so the keystore never lives in the repo.
// CI decodes ANDROID_KEYSTORE_BASE64 from secrets into android/release.keystore.
def keystorePath = System.getenv("KEYSTORE_FILE")
def hasKeystore = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'com.edhpowerlevel.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.edhpowerlevel.client"
        minSdk 24
        targetSdk 34
        // 注入来源：release.yml assembleRelease 时传 -PappVersionName/-PappVersionCode
        //（tag = 提交时间戳）；本地直接 gradle 构建时回退到下方默认值。
        versionCode project.findProperty("appVersionCode")?.toInteger() ?: 1
        versionName project.findProperty("appVersionName") ?: "0.1.0"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP signs v1+v2 by default when a signingConfig is present.
            // Fall back to the debug key so local `assembleRelease` still yields
            // an installable APK without a release keystore.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Produced by `gomobile bind -target=android` in the release workflow and copied here.
    implementation files('libs/mobile.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Kotlin 1.8+ merged kotlin-stdlib-jdk7/jdk8 into kotlin-stdlib, but some transitive
// dependencies still reference the old 1.6.x artifacts, causing duplicate classes.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
