plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edhpowerlevel.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.edhpowerlevel.client"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Produced by `gomobile bind -target=android` in the release workflow and copied here.
    implementation files('libs/mobile.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Kotlin 1.8+ merged kotlin-stdlib-jdk7/jdk8 into kotlin-stdlib, but some transitive
// dependencies still reference the old 1.6.x artifacts, causing duplicate classes.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
